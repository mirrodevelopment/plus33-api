# ─────────────────────────────────────────────
#  Plus33 API – Application Configuration
# ─────────────────────────────────────────────
spring.application.name=plus33-api
server.port=8083

# ── H2 Database Configuration ──────────────────
spring.datasource.url=jdbc:h2:mem:plus33db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ── MySQL Configuration (Commented out) ─────────
# spring.datasource.url=jdbc:mysql://localhost:3306/plus33?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ── H2 Console ────────────────────────────────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.jpa.properties.hibernate.format_sql=true

# ── File Upload ────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# ── Upload directory (local fallback) ──────────
plus33.upload.dir=uploads

# ── Cloudinary (set your credentials) ─────────
plus33.cloudinary.cloud-name=your_cloud_name
plus33.cloudinary.api-key=your_api_key
plus33.cloudinary.api-secret=your_api_secret

# ── Actuator ───────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── CORS (React dev server) ────────────────────
plus33.cors.allowed-origins=http://localhost:8090,http://localhost:5173,https://plus33.in,https://plus33.fr,https://www.plus33.fr,https://plus33coffee.fr,https://www.plus33coffee.fr


