<!--
  FILE: journal.html
  ══════════════════════════════════════════════════
  PURPOSE:
  Lifestyle blog/journal presentation for PLUS33.

  RESPONSIBILITIES:
  - Renders the journal category filters and header description.
  - Dynamically hosts the grid container for articles fetched via JSON.
  - Showcases featured editorial stories at the top.

  ARCHITECTURE NOTES:
  - Dynamically mounted by /js/router.js inside the #app SPA root.
  - Article listings, dynamic filter injections, and tag switches are driven by /js/journal.js.

  ACCESSIBILITY:
  - Categorization and filter buttons are configured to be focusable and interactive.
  - Article listing elements are wrapped in semantic article/section HTML elements.

  DEVELOPED BY : MIRRO
  CODED BY     : SIVASURYA
  LAST UPDATED : 2026-05-23
  ══════════════════════════════════════════════════
-->
<div class="journal-page">
  <!-- ═════════ JOURNAL HEADER ═════════ -->
  <section class="journal-page__header">
    <div class="container">
      <div class="journal-page__header-inner">
        <div>
          <span class="t-label reveal reveal-1">+33 · Founded 2024</span>
          <h1 class="display-lg text-cream reveal reveal-2" style="margin-top: 20px;">Journal</h1>
        </div>
        <p class="t-body reveal reveal-3" style="max-width: 360px;">
          Stories from inside the cup. Dispatches from Paris, London, Dubai 
          and every terroir we visit in between.
        </p>
      </div>
    </div>
  </section>

  <!-- ═════════ FEATURED STORY ═════════ -->
  <section class="journal-page__featured">
    <div class="container" id="journal-featured-root"></div>
  </section>

  <!-- ═════════ JOURNAL FILTERS ═════════ -->
  <div class="journal-page__filters">
    <div class="container">
      <div class="journal-filters-inner" id="journal-filters"></div>
    </div>
  </div>

  <!-- ═════════ JOURNAL GRID ═════════ -->
  <section class="journal-page__grid">
    <div class="container">
      <div class="journal-articles" id="journal-grid"></div>
    </div>
  </section>
</div>
